<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxry Shop Login</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body class="login-body">
    <div class="login-container">
        <div class="left-side">
            <h1>WELCOME TO LUXRY SHOP</h1>
            <P>Discovery preium products, amazing discount, qulity delivery, and shopping experience.</P>
            <div class="features">
                <div><ion-icon name="car"></ion-icon>Fast Delivery</div>
                <div> <ion-icon name="shield"></ion-icon>Secure Paynment</div>
                <div><ion-icon name="cart"></ion-icon> Best Products</div>
            </div>
        </div>
        <div class="right-side">
            <form id="loginForm">
                <h2>Login Account</h2>
                <div class="input-box">
                    <ion-icon name="send"></ion-icon>
                    <input type="email" placeholder="EmailAdress" required>
                </div>
                <div class="input-box">
                    <ion-icon name="lock-open"></ion-icon>
                    <input type="password" placeholder="password" required>
                </div>
                <button type="submit">login</button>
                <p class="small-text">
                    Dont have an account?
                    <span>Register</span>
                </p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>


</body>

</html>
